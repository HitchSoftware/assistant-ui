steps:
  - id: install
    name: node:24
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@11.10.0 --activate
        pnpm install --frozen-lockfile

  - id: version
    name: node:24
    entrypoint: bash
    env:
      - TAG_NAME=$TAG_NAME
    args:
      - -ceu
      - |
        if [ -z "$${TAG_NAME}" ]; then
          echo "No TAG_NAME provided, skipping version bump"
          exit 0
        fi

        # Accept tags like v1.2.3 or 1.2.3
        export VERSION="$${TAG_NAME#v}"
        echo "=== Setting publishable @hitchsoftware/* package versions to $${VERSION} ==="

        node <<'NODE'
        const fs = require("fs");
        const path = require("path");

        const version = process.env.VERSION;
        const scope = "@hitchsoftware/";
        const packagesDir = "packages";

        const dirs = fs
          .readdirSync(packagesDir, { withFileTypes: true })
          .filter((d) => d.isDirectory())
          .map((d) => path.join(packagesDir, d.name));

        let updated = 0;
        for (const dir of dirs) {
          const pkgPath = path.join(dir, "package.json");
          if (!fs.existsSync(pkgPath)) continue;
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          if (!pkg.name || !pkg.name.startsWith(scope)) continue;
          if (pkg.private === true) continue;
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          console.log("version", pkgPath, "->", version);
          updated++;
        }
        console.log("Total packages versioned:", updated);
        if (updated === 0) {
          console.error("No publishable packages found");
          process.exit(1);
        }
        NODE

  - id: build
    name: node:24
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@11.10.0 --activate
        pnpm turbo build --concurrency=4 --filter="./packages/*"

  - id: test
    name: node:24
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@11.10.0 --activate
        pnpm turbo test --concurrency=2 --filter="./packages/*"

  - id: publish
    name: node:24
    entrypoint: bash
    secretEnv:
      - GITHUB_PACKAGES_PAT
    env:
      - TAG_NAME=$TAG_NAME
    args:
      - -ceu
      - |
        if [ -z "$${TAG_NAME}" ]; then
          echo "No TAG_NAME provided, skipping publish"
          exit 0
        fi

        corepack enable
        corepack prepare pnpm@11.10.0 --activate

        export VERSION="$${TAG_NAME#v}"
        echo "=== Configuring npm registry for @hitchsoftware ==="
        cat > .npmrc <<EOF
        registry=https://registry.npmjs.org/
        @hitchsoftware:registry=${_NPM_REGISTRY}
        //npm.pkg.github.com/:_authToken=$${GITHUB_PACKAGES_PAT}
        always-auth=true
        EOF

        echo "=== Rewriting internal @hitchsoftware/* dependency ranges to $${VERSION} ==="
        node <<'NODE'
        const fs = require("fs");
        const path = require("path");

        const version = process.env.VERSION;
        const scope = "@hitchsoftware/";
        const packagesDir = "packages";

        const walk = (dir) => {
          const results = [];
          for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
            const full = path.join(dir, ent.name);
            if (ent.isDirectory()) {
              if (ent.name === "node_modules" || ent.name === "dist") continue;
              results.push(...walk(full));
            } else if (ent.name === "package.json") {
              results.push(full);
            }
          }
          return results;
        };

        let count = 0;
        for (const file of walk(packagesDir)) {
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          if (!pkg.name || !pkg.name.startsWith(scope)) continue;
          if (pkg.private === true) continue;

          let changed = false;
          if (pkg.version !== version) {
            pkg.version = version;
            changed = true;
          }

          for (const field of [
            "dependencies",
            "devDependencies",
            "peerDependencies",
            "optionalDependencies",
          ]) {
            if (!pkg[field]) continue;
            for (const dep of Object.keys(pkg[field])) {
              if (dep.startsWith(scope) && pkg[field][dep] !== version) {
                pkg[field][dep] = version;
                changed = true;
              }
            }
          }

          if (changed) {
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            console.log("rewrote", file);
            count++;
          }
        }
        console.log("Total packages rewritten:", count);
        NODE

        echo "=== Publishing non-private packages/* to GitHub Packages ==="
        pnpm -r --filter "./packages/*" publish \
          --access restricted \
          --no-git-checks \
          --registry "${_NPM_REGISTRY}"

        echo "=== Publish complete ==="
        rm -f .npmrc

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/HITCH_NUGET_API_KEY/versions/latest
      env: GITHUB_PACKAGES_PAT

substitutions:
  _NPM_REGISTRY: https://npm.pkg.github.com

options:
  machineType: E2_HIGHCPU_32
  env:
    - TAG_NAME=$TAG_NAME
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
