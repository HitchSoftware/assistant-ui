packages:
  - api-surface
  - packages/*
  - examples/*
  - apps/*
  - templates/*

linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
  - '@types/*'

strictDepBuilds: true

verifyDepsBeforeRun: install

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@hitchsoftware/*'
  - '@next/*'
  - '@typescript/typescript-*'
  - next
  - typescript

allowBuilds:
  '@clerk/shared': false
  '@google/genai': false
  '@mongodb-js/zstd': false
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  core-js: false
  esbuild@0.28.1: true
  node-liblzma: false
  protobufjs: false
  react-grab: false
  sqlite3@5.1.7: true
